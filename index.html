<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BAW × 台中購物節｜幸運大轉盤</title><style>
:root{font-family:'Microsoft JhengHei','Noto Sans TC',sans-serif;color:#fff;background:#160b16}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 12%,#80304a 0,#350f25 45%,#130b17 100%);min-height:100vh}.wrap{max-width:1000px;margin:auto;padding:24px 16px 60px;text-align:center}.eyebrow{color:#ffd991;letter-spacing:4px;font-weight:900}.title{font-size:clamp(29px,5vw,56px);margin:10px 0 4px;text-shadow:0 4px 20px #0008}.subtitle{color:#ffe5bb;margin:0 0 20px}.stage{position:relative;width:min(92vw,580px);aspect-ratio:1;margin:auto;filter:drop-shadow(0 15px 30px #0009)}canvas{width:100%;height:100%;display:block}.pointer{position:absolute;left:50%;top:-5px;transform:translateX(-50%);width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:42px solid #fff3bd;filter:drop-shadow(0 3px 3px #000a);z-index:5}.spin{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);border-radius:50%;width:22%;aspect-ratio:1;border:5px solid #ffe2a0;background:linear-gradient(135deg,#f9c66b,#b61e3e 70%);color:white;font-weight:1000;font-size:clamp(19px,3.5vw,28px);box-shadow:0 4px 18px #0009;cursor:pointer;z-index:6}.spin:disabled{opacity:.75;cursor:wait}.spin small{display:block;font-size:11px}.result{margin:20px auto;max-width:580px;min-height:75px;background:#ffffff12;border:1px solid #ffdb9e77;border-radius:18px;padding:17px;font-size:20px;font-weight:800}.result strong{color:#ffe08a}.prizes{margin:28px auto 0;text-align:left;max-width:850px}.prizes h2{text-align:center;color:#ffdb95}.prize-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.prize{background:#ffffff10;border:1px solid #ffffff25;border-radius:12px;padding:13px 12px;font-size:15px}.prize b{color:#ffd28b}.prize.jackpot{background:#b9274550;border-color:#ffd28b}.tag{display:inline-block;background:#f9d88c;color:#5b1830;border-radius:20px;padding:2px 7px;font-size:11px;font-weight:bold;margin-left:4px}.foot{font-size:12px;color:#f0c9d3;margin-top:22px}.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#140617bd;z-index:20;padding:16px}.overlay.show{display:flex}.modal{background:linear-gradient(160deg,#fff3d1,#f6c97c);color:#5a1830;border:6px solid #fff;border-radius:24px;max-width:440px;width:100%;padding:30px 22px;box-shadow:0 20px 80px #000a;text-align:center;animation:pop .45s both}.modal h2{font-size:36px;margin:8px}.modal .award{font-size:26px;font-weight:900}.modal button{margin-top:22px;border:0;background:#a91940;color:white;border-radius:40px;padding:14px 35px;font-size:18px;font-weight:bold;cursor:pointer}@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}.confetti{position:fixed;top:-30px;width:10px;height:18px;z-index:30;pointer-events:none;animation:fall 2.8s linear forwards}@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot));opacity:0}}@media(max-width:500px){.wrap{padding-top:18px}.prize-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.prize{font-size:13px}.spin{border-width:3px}.pointer{border-left-width:13px;border-right-width:13px;border-top-width:30px}}

.reveal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:radial-gradient(circle,#8d224e 0%,#330a27 65%,#140513 100%);z-index:18;text-align:center;overflow:hidden;padding:20px}.reveal.show{display:flex}.reveal-inner{position:relative;z-index:2;animation:revealPulse .65s ease-in-out infinite alternate}.reveal-icon{font-size:clamp(80px,20vw,140px);filter:drop-shadow(0 0 25px #ffe69b);animation:revealBounce .8s ease-in-out infinite alternate}.reveal-title{font-size:clamp(36px,9vw,65px);font-weight:1000;color:#ffe49a;text-shadow:0 0 22px #ffb94d}.reveal-sub{font-size:20px;color:#fff0ce;margin-top:15px}.reveal-rays{font-size:36px;color:#ffe69b;letter-spacing:20px;animation:revealRotate 2s linear infinite}@keyframes revealPulse{to{transform:scale(1.1)}}@keyframes revealBounce{to{transform:translateY(-16px) rotate(7deg)}}@keyframes revealRotate{to{transform:rotate(360deg)}}.reveal.premium{background:radial-gradient(circle,#c38d27 0%,#632146 60%,#1b071c 100%)}.reveal.premium:before{content:'';position:absolute;inset:-100%;background:repeating-conic-gradient(from 0deg,#fff4ae30 0deg 12deg,transparent 12deg 26deg);animation:revealRotate 6s linear infinite}.modal .tier{color:#a31644;font-size:18px;font-weight:900;margin:8px 0}.modal .award{line-height:1.4}
@media(prefers-reduced-motion:reduce){.reveal-inner,.reveal-icon,.reveal-rays,.reveal.premium:before{animation:none}}
</style></head><body><main class="wrap"><div class="eyebrow">TAICHUNG SHOPPING FESTIVAL</div><h1 class="title">BAW × 台中購物節</h1><p class="subtitle">✦ 幸運大轉盤 ✦　好禮等你帶回家</p><div class="stage"><canvas id="wheel" width="1000" height="1000" aria-label="11格幸運大轉盤"></canvas><div class="pointer"></div><button id="spin" class="spin">立即<br>抽獎<small>SPIN</small></button></div><div class="result" id="result" aria-live="polite">按下轉盤中央按鈕，試試你的好手氣！</div><section class="prizes"><h2>🎁 活動獎品一覽</h2><div class="prize-grid" id="prizes"></div></section><p class="foot">BAW 專利空調氣墊鞋｜活動獎項依現場公告及實際庫存為準</p></main><div id="reveal" class="reveal" aria-live="polite"><div class="reveal-inner"><div class="reveal-rays">✦ ✨ ✦</div><div class="reveal-icon" id="revealIcon">🎉</div><div class="reveal-title" id="revealTitle">好運降臨！</div><div class="reveal-sub">精彩獎項即將揭曉…</div></div></div><div id="overlay" class="overlay" role="dialog" aria-modal="true"><div class="modal"><div style="font-size:52px">🎉</div><h2>恭喜中獎！</h2><div class="tier" id="tier"></div><div class="award" id="award"></div><p id="extra"></p><p style="font-size:16px;line-height:1.7;font-weight:700">感謝參與BAW活動，煩請將畫面出示給門市人員</p><button id="close">開心收下</button></div></div><script>
const prizes=[{name:'鞋油',sub:'＋再抽一次',p:7},{name:'鞋把',sub:'＋再抽一次',p:7},{name:'現金折扣100元',sub:'＋再抽一次',p:7},{name:'現金折扣300元',sub:'',p:7},{name:'現金折扣500元',sub:'',p:45},{name:'現金折扣800元',sub:'',p:6},{name:'現金折扣1000元',sub:'',p:5},{name:'現金折扣1500元',sub:'三等獎',p:4},{name:'BAW科技除臭襪',sub:'三等獎／價值1280元',p:7},{name:'0928／0927拖鞋一雙',sub:'二等獎／價值3980元',p:3},{name:'BAW鞋款一雙',sub:'一等獎／價值5600元',p:2}];
const canvas=document.getElementById('wheel'),ctx=canvas.getContext('2d'),N=prizes.length,step=Math.PI*2/N,center=500,R=460;let angle=0,busy=false;
const lines=prizes.map((_,i)=>String(i+1).padStart(2,'0'));
function draw(){ctx.clearRect(0,0,1000,1000);ctx.save();ctx.translate(center,center);ctx.rotate(angle);for(let i=0;i<N;i++){let a=-Math.PI/2+(i-.5)*step;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,R,a,a+step);ctx.closePath();ctx.fillStyle=i%2===0?'#ffedbf':'#ba2848';ctx.fill();ctx.lineWidth=5;ctx.strokeStyle='#d7a448';ctx.stroke();ctx.save();ctx.rotate(i*step);ctx.translate(0,-302);ctx.fillStyle=i%2===0?'#6b1933':'#fff6dc';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold 58px Microsoft JhengHei, sans-serif';ctx.fillText(lines[i],0,0,170);ctx.restore()}ctx.beginPath();ctx.arc(0,0,R+9,0,Math.PI*2);ctx.lineWidth=24;ctx.strokeStyle='#f3bf66';ctx.stroke();for(let j=0;j<44;j++){let a=j*2*Math.PI/44;ctx.beginPath();ctx.arc(Math.cos(a)*(R+9),Math.sin(a)*(R+9),5,0,Math.PI*2);ctx.fillStyle='#fff9d7';ctx.fill()}ctx.restore()}
function rand(){if(window.crypto&&window.crypto.getRandomValues){let a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296}return Math.random()}
function pick(){let x=rand()*100;for(let i=0;i<N;i++){x-=prizes[i].p;if(x<0)return i}return N-1}
const ease=t=>1-Math.pow(1-t,4);document.getElementById('prizes').innerHTML=prizes.map((p,i)=>`<div class="prize ${i>=7?'jackpot':''}"><b>${String(i+1).padStart(2,'0')}.</b> ${p.name}${p.sub?` <span class="tag">${p.sub}</span>`:''}</div>`).join('');
function celebrate(count=90){for(let i=0;i<count;i++){let el=document.createElement('i');el.className='confetti';el.style.left=rand()*100+'vw';el.style.background=['#ffe08d','#ff477a','#fff','#68d5db'][i%4];el.style.animationDelay=rand()*.6+'s';el.style.setProperty('--dx',(rand()*240-120)+'px');el.style.setProperty('--rot',(rand()*1200)+'deg');document.body.appendChild(el);setTimeout(()=>el.remove(),3700)}}
function showPrize(idx){
 const p=prizes[idx],tier=idx===10?'🏆 一等獎':idx===9?'🥈 二等獎':idx===7||idx===8?'🥉 三等獎':'';
 document.getElementById('tier').textContent=tier;
 document.getElementById('award').textContent=p.name;
 document.getElementById('extra').textContent=idx<=2?'🎟️ 恭喜獲得再抽一次！':idx===10?'🎊 恭喜獲得價值5600元鞋款！':idx===9?'🎊 恭喜獲得價值3980元拖鞋！':idx===8?'🎊 恭喜獲得價值1280元科技除臭襪！':'';
 document.getElementById('result').innerHTML=`🎊 恭喜抽中：<strong>${p.name}</strong>${p.sub?'｜'+p.sub:''}`;
 document.getElementById('overlay').classList.add('show');
 if(idx>=7)celebrate(160);
 busy=false;document.getElementById('spin').disabled=false;
}
function beginReveal(idx){
 if(idx<7){showPrize(idx);return;}
 const premium=true,el=document.getElementById('reveal');
 el.classList.toggle('premium',premium);
 document.getElementById('revealIcon').textContent=idx===10?'🏆':idx===9?'🥈':premium?'✨':'🎉';
 document.getElementById('revealTitle').textContent=idx===10?'超級大獎降臨！':idx===9?'幸運大獎出現！':premium?'恭喜！好運爆發！':'恭喜中獎！';
 el.classList.add('show');celebrate(190);
 setTimeout(()=>{el.classList.remove('show');showPrize(idx)},2600);
}
function spin(){
 if(busy)return;busy=true;document.getElementById('spin').disabled=true;
 document.getElementById('result').textContent='幸運轉盤旋轉中…';
 const idx=pick(),current=((angle%(Math.PI*2))+(Math.PI*2))%(Math.PI*2),desired=(((-idx*step)%(Math.PI*2))+(Math.PI*2))%(Math.PI*2),delta=((desired-current+Math.PI*2)%(Math.PI*2))+Math.PI*2*6,start=performance.now(),from=angle;
 function tick(now){let t=Math.min(1,(now-start)/3000);angle=from+delta*ease(t);draw();if(t<1){requestAnimationFrame(tick)}else{angle=desired;draw();beginReveal(idx)}}requestAnimationFrame(tick)
}
document.getElementById('spin').addEventListener('click',spin);document.getElementById('close').addEventListener('click',()=>document.getElementById('overlay').classList.remove('show'));draw();
</script></body></html>
